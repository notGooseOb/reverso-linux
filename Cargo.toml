[package]
name = "reverso-linux"
version = "0.0.3"
edition = "2021"
description = "Linux desktop translator using the Reverso API"
license = "MIT"
build = "build.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
pango = "0.22"
pangocairo = "0.22"
cairo-rs = "0.22"
curl = "0.4"
serde_json = "1"
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
